{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удалить блюдо — Хрум</title>
    <link rel="stylesheet" href="{% static 'styles/register.css' %}">
</head>
<body>
    <main>
        <div class="main">
            <div class="create-acc">
                <p>Удаление<br>блюда</p>
            </div>
            <div style="text-align: center; color: white; margin-bottom: 20px; font-size: 18px;">
                Вы уверены, что хотите удалить <strong>{{ dish.title }}</strong>?
            </div>
            <form method="post" style="display: flex; flex-direction: column; align-items: center;">
                {% csrf_token %}
                <button type="submit" class="button" style="background: #d32f2f; color: white; margin-top: 0;">УДАЛИТЬ</button>
                <a href="/catalog/" class="link-secondary" style="margin-top: 15px;">← Отмена</a>
            </form>
        </div>
    </main>
</body>
</html>
