{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать блюдо — Хрум</title>
    <link rel="stylesheet" href="{% static 'styles/register.css' %}">
    <style>
        .auth-form { max-width: 500px; }
        .form-style { height: 40px; padding: 0 15px; }
        textarea.form-style { height: 100px; padding: 10px 15px; resize: vertical; }
        select.form-style { height: 40px; }
    </style>
</head>
<body>
    <main>
        <div class="main">
            <div class="create-acc">
                <p>Редактирование<br>блюда</p>
            </div>

            <form class="auth-form" method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="button" style="margin-top: 20px;">СОХРАНИТЬ</button>
                <a href="/catalog/" class="link-secondary">← Назад в каталог</a>
            </form>
        </div>
    </main>
</body>
</html>
